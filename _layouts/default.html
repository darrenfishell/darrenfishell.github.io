<!DOCTYPE html>
<html>
  <head>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1VECQ7VVHN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-1VECQ7VVHN');
    </script>

    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>

    {% include meta.html %}

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    
    {% if page.url == '/' or page.url == '/index.html' %}
    <!-- Preload hints for news headlines (homepage only) -->
    <link rel="dns-prefetch" href="https://api.allorigins.win">
    <link rel="preconnect" href="https://api.allorigins.win" crossorigin>
    <link rel="dns-prefetch" href="https://rss.nytimes.com">
    <link rel="dns-prefetch" href="https://rss.cnn.com">
    <link rel="dns-prefetch" href="http://feeds.bbci.co.uk">
    <link rel="dns-prefetch" href="https://feeds.npr.org">
    {% endif %}

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body{% if page.permalink == '/blog/' or page.permalink == '/projects/' or page.date %} class="content-page"{% endif %}>
    {% include header.html %}
<div id="main" role="main" class="container">
      {{ content }}
</div>
    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
